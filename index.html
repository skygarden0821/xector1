<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="XECTOR1">
<meta name="theme-color" content="#000000">
<title>Xector1 Production｜Member Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <!-- APP BAR -->
  <header class="app-bar">
    <div class="app-bar-inner">
      <span class="brand">XECTOR<span class="brand-1">1</span></span>
      <button class="bar-av-btn" onclick="goPage('settings')" aria-label="設定">
        <div class="av av-sm" id="bar-av">?</div>
      </button>
    </div>
  </header>

  <main class="scroll-area" id="scroll-area">

    <!-- ══════════ HOME ══════════ -->
    <div id="page-home" class="page active">

      <!-- Greeting -->
      <div class="home-header">
        <p class="home-greeting">お帰りなさい</p>
        <h1 class="home-name" id="hero-name">ゲスト</h1>
      </div>

      <!-- 1年後の目標 -->
      <button class="goal-block" onclick="goPage('settings')" aria-label="目標を編集">
        <div class="goal-block-top">
          <span class="goal-block-label">1年後の目標</span>
          <span class="goal-block-edit">編集</span>
        </div>
        <p class="goal-block-text" id="goal-text">目標を設定してください</p>
      </button>

      <!-- Quick Actions -->
      <div class="qa-row">
        <button class="qa-item" onclick="goPage('book')">
          <span class="qa-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2.5"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          </span>
          <span class="qa-label">予約</span>
        </button>
        <button class="qa-item" onclick="goPage('tips')">
          <span class="qa-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 0 0-4 12.7V17a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-2.3A7 7 0 0 0 12 2z"/><line x1="9" y1="22" x2="15" y2="22"/></svg>
          </span>
          <span class="qa-label">Tips</span>
        </button>
        <button class="qa-item" onclick="goPage('seisaku')">
          <span class="qa-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="1.2"/><circle cx="17.5" cy="10.5" r="1.2"/><circle cx="8.5" cy="7.5" r="1.2"/><circle cx="6.5" cy="12.5" r="1.2"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.6-.7 1.6-1.7 0-.4-.2-.8-.4-1.1-.3-.3-.4-.6-.4-1.1a1.6 1.6 0 0 1 1.7-1.7H16.5c3 0 5.5-2.5 5.5-5.5C22 6 17.5 2 12 2z"/></svg>
          </span>
          <span class="qa-label">制作</span>
        </button>
        <button class="qa-item" onclick="window.open('https://forms.gle/wFoujvkfWBbSNfLM8','_blank')">
          <span class="qa-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </span>
          <span class="qa-label">問合せ</span>
        </button>
      </div>

      <!-- Divider -->
      <div class="divider"></div>

      <!-- Today's Pick -->
      <section class="section">
        <div class="section-head">
          <span class="section-label">TODAY</span>
          <span class="section-count" id="pick-num"></span>
        </div>
        <button class="pick-card" id="pick-card" onclick="openPick()">
          <span class="pick-thumb" id="pick-thumb" style="display:none"></span>
          <div class="pick-meta-row">
            <span class="pick-cat" id="pick-tag"></span>
            <span class="pick-min" id="pick-meta"></span>
          </div>
          <p class="pick-title" id="pick-title">—</p>
          <p class="pick-preview" id="pick-preview">—</p>
          <div class="pick-foot">
            <span class="pick-cta" id="pick-cta">続きを読む</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </div>
        </button>
      </section>

      <!-- Recent Tips -->
      <section class="section">
        <div class="section-head">
          <span class="section-label">最近のTips</span>
          <button class="section-link" onclick="goPage('tips')">すべて表示</button>
        </div>
        <div id="recent-tips"></div>
      </section>

      <div class="page-end"></div>
    </div>

    <!-- ══════════ TIPS ══════════ -->
    <div id="page-tips" class="page">
      <div class="page-head">
        <h1 class="page-h1">Tips</h1>
        <p class="page-sub">Xector1 Production のノウハウ＆コラム</p>
      </div>

      <div class="search-wrap">
        <span class="search-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
        <input class="search-input" type="text" id="tip-search" placeholder="キーワードで検索" oninput="renderTips()">
        <button class="search-clear" id="search-clear" onclick="clearSearch()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="chip-scroll">
        <div class="chip-row" id="filter-row"></div>
      </div>

      <div class="tip-list" id="tips-list"></div>
      <div class="empty-state" id="tips-empty" style="display:none">
        <p class="empty-text">該当するTipsが見つかりません</p>
      </div>
      <div class="page-end"></div>
    </div>

    <!-- ══════════ 制作（準備中） ══════════ -->
    <div id="page-seisaku" class="page">
      <div class="coming-soon">
        <p class="coming-soon-en">COMING SOON</p>
        <h2 class="coming-soon-title">準備中</h2>
        <p class="coming-soon-sub">このページは現在準備中です。<br>もうしばらくお待ちください。</p>
      </div>
    </div>

    <!-- ══════════ BOOK ══════════ -->
    <div id="page-book" class="page">
      <div class="page-head">
        <h1 class="page-h1">予約</h1>
        <p class="page-sub">セッションを選んで予約</p>
      </div>

      <a class="doc-link" href="https://docs.google.com/document/d/1vhECxaHXvovLKNmmOFged8pR0biWdhIPI_9OiP__QHE/edit?usp=sharing" target="_blank" rel="noopener">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <span>予約ルールブックを確認</span>
        <svg class="link-chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </a>

      <div class="seg-control">
        <span class="seg-thumb" id="seg-thumb"></span>
        <button class="seg active" id="prog-tab-1" onclick="switchProgram(1)">プロデュース</button>
        <button class="seg" id="prog-tab-2" onclick="switchProgram(2)">ボイトレA</button>
        <button class="seg" id="prog-tab-3" onclick="switchProgram(3)">ボイトレB</button>
      </div>

      <div class="ycbm" id="ycbm-panel-1"><iframe src="https://skygarden0821.youcanbook.me/" frameborder="0" scrolling="yes" allowtransparency="true"></iframe></div>
      <div class="ycbm" id="ycbm-panel-2" style="display:none"><iframe src="https://xector1voice01.youcanbook.me/" frameborder="0" scrolling="yes" allowtransparency="true"></iframe></div>
      <div class="ycbm" id="ycbm-panel-3" style="display:none"><iframe src="https://xector1voice02.youcanbook.me/" frameborder="0" scrolling="yes" allowtransparency="true"></iframe></div>
    </div>

    <!-- ══════════ SETTINGS ══════════ -->
    <div id="page-settings" class="page">
      <div class="page-head">
        <h1 class="page-h1">設定</h1>
        <p class="page-sub">プロフィールと目標を編集</p>
      </div>

      <div class="settings-avatar-wrap">
        <button class="av-btn" onclick="document.getElementById('av-input').click()">
          <div class="av av-xl" id="av-preview">?</div>
          <span class="av-edit-badge">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          </span>
        </button>
        <p class="av-hint">タップで写真を変更</p>
      </div>

      <input type="file" id="av-input" accept="image/*" style="display:none" onchange="onAvatarFileSelected(event)">

      <div class="crop-panel" id="crop-panel">
        <p class="crop-note">ドラッグで位置調整 · ピンチでズーム</p>
        <div class="crop-stage" id="crop-stage"><canvas id="crop-canvas"></canvas></div>
        <div class="crop-row">
          <button class="btn-ghost" onclick="cancelCrop()">キャンセル</button>
          <button class="btn-solid" onclick="saveCrop()">保存</button>
        </div>
      </div>

      <p class="group-label">プロフィール</p>
      <div class="group">
        <div class="group-row">
          <span class="group-row-label">表示名</span>
          <input class="group-row-input" type="text" id="settings-name" placeholder="例：田中雄介">
        </div>
        <div class="group-row group-row-stack">
          <span class="group-row-label">1年後の目標</span>
          <textarea class="group-row-ta" id="settings-goal" placeholder="例：2026年末までにYouTube登録者10万人達成"></textarea>
        </div>
      </div>

      <button class="btn-save" onclick="saveAll()">変更を保存</button>

      <p class="group-foot">Xector1 Production</p>
      <div class="page-end"></div>
    </div>

  </main>

  <!-- BOTTOM NAV -->
  <nav class="nav">
    <button class="nav-item active" id="nav-home" onclick="goPage('home')">
      <span class="nav-icon-wrap">
        <svg class="nav-svg nav-out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <svg class="nav-svg nav-fill" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2h-5v-9h-4v9H5a2 2 0 0 1-2-2z"/></svg>
      </span>
      <span class="nav-lbl">ホーム</span>
    </button>
    <button class="nav-item" id="nav-tips" onclick="goPage('tips')">
      <span class="nav-icon-wrap">
        <svg class="nav-svg nav-out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 0 0-4 12.7V17a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-2.3A7 7 0 0 0 12 2z"/><line x1="9" y1="22" x2="15" y2="22"/></svg>
        <svg class="nav-svg nav-fill" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-4 12.7V17a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-2.3A7 7 0 0 0 12 2z"/></svg>
      </span>
      <span class="nav-lbl">Tips</span>
    </button>
    <button class="nav-item" id="nav-seisaku" onclick="goPage('seisaku')">
      <span class="nav-icon-wrap">
        <svg class="nav-svg nav-out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
        <svg class="nav-svg nav-fill" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 2 7 12 12 22 7 12 2"/></svg>
      </span>
      <span class="nav-lbl">制作</span>
    </button>
    <button class="nav-item" id="nav-book" onclick="goPage('book')">
      <span class="nav-icon-wrap">
        <svg class="nav-svg nav-out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <svg class="nav-svg nav-fill" viewBox="0 0 24 24" fill="currentColor"><path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zM5 10h14v10H5z"/></svg>
      </span>
      <span class="nav-lbl">予約</span>
    </button>
    <button class="nav-item" id="nav-settings" onclick="goPage('settings')">
      <span class="nav-icon-wrap">
        <svg class="nav-svg nav-out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <svg class="nav-svg nav-fill" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-3.3 0-10 1.7-10 5v2h20v-2c0-3.3-6.7-5-10-5z"/></svg>
      </span>
      <span class="nav-lbl">設定</span>
    </button>
  </nav>

</div>

<!-- TIP SHEET -->
<div class="sheet-overlay" id="tip-overlay" onclick="closeTip(event)">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="sheet-grabber"></div>
    <div class="sheet-scroll">
      <div id="tip-content"></div>
    </div>
    <button class="sheet-close" onclick="closeTip()" aria-label="閉じる">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="tips-data.js"></script>
<script src="app.js"></script>
</body>
</html>
